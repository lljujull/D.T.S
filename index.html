<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B90D4" id="metaThemeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="제자훈련 암송">
  <title>제자훈련 말씀 암송 · 32과 64구절</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  :root {
    --peri: #8B90D4;
    --peri-deep: #474B9C;
    --peri-soft: #C3C6EC;
    --peri-wash: #EDEEFA;
    --cream: #F7F1DC;
    --cream-deep: #EBDFBB;
    --paper: #FFFFFF;
    --ink: #2F3167;
    --ink-soft: #7A7DAE;
    --gold: #DFA23A;
    --coral: #DC7A72;
    --blank-ok-bg: #E4F1E2;
    --blank-ok-color: #33683C;
    --blank-ok-border: #5C9E55;
    --blank-no-bg: #FBE7E5;
    --blank-no-color: #A94B44;
    --card-border: var(--peri-wash);
    --r: 22px;
  }

  [data-theme="dark"] {
    --peri: #6368A6;
    --peri-deep: #9094DC;
    --peri-soft: #3D4068;
    --peri-wash: #252843;
    --cream: #141524;
    --cream-deep: #212338;
    --paper: #1B1C2E;
    --ink: #EEF0FD;
    --ink-soft: #9BA0CE;
    --gold: #F1B24B;
    --coral: #E6827A;
    --blank-ok-bg: #1B3522;
    --blank-ok-color: #8CE098;
    --blank-ok-border: #427A4B;
    --blank-no-bg: #3D1F1F;
    --blank-no-color: #FFAAA3;
    --card-border: #2D3050;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 0 0 70px;
    transition: background-color .25s ease, color .25s ease;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 2px 8px;
  }
  .app-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .theme-btn {
    background: var(--paper);
    border: 2px solid var(--card-border);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* Hero Section */
  .hero {
    position: relative;
    margin: 8px 0 16px;
    border-radius: 24px;
    overflow: hidden;
    background: var(--peri);
    color: #fff;
    padding: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .hero-kicker { font-size: 13px; color: #EDEEFA; }
  .hero-title {
    font-family: "Gaegu", cursive;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.2;
    margin: 4px 0 10px;
  }
  .progress-bg {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .hero-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 6px;
    color: #EDEEFA;
  }

  /* Book Selector Tabs */
  .book-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .b-tab {
    flex: 1;
    border: 2px solid var(--card-border);
    background: var(--paper);
    border-radius: 14px;
    padding: 9px 4px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .2s;
  }
  .b-tab.on {
    background: var(--peri-deep);
    border-color: var(--peri-deep);
    color: #fff;
  }

  /* Lesson Card List */
  .lesson-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .l-card {
    background: var(--paper);
    border: 2px solid var(--card-border);
    border-radius: 18px;
    padding: 14px 16px;
  }
  .l-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .l-badge {
    font-family: "Gaegu", cursive;
    font-size: 16px;
    font-weight: 700;
    color: var(--peri);
    flex: none;
  }
  .l-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    flex: 1;
  }
  .v-chips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .v-chip {
    background: var(--peri-wash);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: transform .1s;
  }
  .v-chip:active { transform: scale(.97); }
  .v-chip.done {
    background: var(--blank-ok-bg);
    border-color: var(--blank-ok-border);
    color: var(--blank-ok-color);
  }
  .v-chip span.ref { font-size: 13px; font-weight: 700; }
  .v-chip span.tag { font-size: 10.5px; opacity: .8; }

  /* Practice View Elements */
  .back-btn {
    background: none;
    border: none;
    color: var(--peri-deep);
    font-size: 14.5px;
    font-weight: 700;
    padding: 10px 0;
    cursor: pointer;
  }
  .verse-toggle {
    display: flex;
    gap: 8px;
    margin: 14px 0 16px;
  }
  .vt-btn {
    flex: 1;
    border-radius: 14px;
    border: 2px solid var(--card-border);
    background: var(--paper);
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .vt-btn.on {
    background: var(--peri-deep);
    border-color: var(--peri-deep);
    color: #fff;
  }
  .vt-btn .vt-name { font-size: 11px; opacity: .85; }
  .vt-btn .vt-ref { font-size: 13.5px; font-weight: 700; }

  .card {
    background: var(--paper);
    border-radius: var(--r);
    padding: 18px;
    border: 2px solid var(--card-border);
  }
  .verse-row {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--card-border);
    align-items: baseline;
  }
  .verse-row:last-child { border-bottom: none; }
  .v-num {
    font-family: "Gaegu", cursive;
    font-weight: 700;
    font-size: 19px;
    color: var(--peri-deep);
    min-width: 18px;
    text-align: right;
    flex: none;
  }
  .v-txt {
    font-family: "Gowun Dodum", serif;
    font-size: 16px;
    line-height: 1.95;
    flex: 1;
  }

  button { font-family: inherit; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--peri-deep);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--peri-wash); color: var(--ink); }
  .btn.cream { background: var(--cream-deep); color: var(--ink); }
  .btn.sm { padding: 8px 12px; font-size: 12px; border-radius: 10px; width: auto; }
  .row { display: flex; gap: 8px; margin-top: 10px; }

  .levels { display: flex; gap: 6px; margin: 16px 0 12px; }
  .lv-btn {
    flex: 1;
    border-radius: 12px;
    border: 2px solid var(--card-border);
    background: var(--paper);
    padding: 8px 2px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .lv-btn.on { background: var(--peri-deep); border-color: var(--peri-deep); color: #fff; }

  .blank {
    display: inline-block;
    font-family: "Gowun Dodum", serif;
    font-size: 16px;
    border: none;
    border-bottom: 2.5px solid var(--peri);
    background: var(--peri-wash);
    border-radius: 6px 6px 0 0;
    padding: 1px 4px;
    margin: 0 1px;
    color: var(--ink);
    text-align: center;
    min-width: 2.6em;
  }
  .blank.ok { background: var(--blank-ok-bg); border-bottom-color: var(--blank-ok-border); color: var(--blank-ok-color); }
  .blank.no { background: var(--blank-no-bg); border-bottom-color: var(--coral); color: var(--blank-no-color); text-decoration: line-through; }
  .fix { color: var(--coral); font-size: 13px; margin-left: 3px; font-weight: 700; }
  .score-box { background: var(--cream-deep); border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 12px; }
  .score-box b { font-family: "Gaegu", cursive; font-size: 32px; display: block; }

  textarea {
    width: 100%;
    min-height: 160px;
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 12px;
    font-family: "Gowun Dodum", serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    background: var(--paper);
    resize: vertical;
  }

  .nav-bar {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    padding-top: 14px;
    border-top: 2px dashed var(--card-border);
  }
  .backup-box {
    margin-top: 28px;
    padding: 12px 14px;
    background: var(--paper);
    border: 2px solid var(--card-border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="app-name">제자훈련 암송 프로젝트</div>
    <button class="theme-btn" id="themeToggle">
      <span id="themeIcon">🌙</span> <span id="themeText">다크모드</span>
    </button>
  </div>

  <!-- ===== HOME VIEW ===== -->
  <section id="homeView">
    <div class="hero">
      <div class="hero-kicker" id="hKicker">1권 · 제자훈련의 터 다지기</div>
      <div class="hero-title" id="hTitle">제자훈련 암송</div>
      <div class="progress-bg">
        <div class="progress-bar" id="pBar" style="width: 0%"></div>
      </div>
      <div class="hero-meta">
        <span id="pText">0 / 0 완료</span>
        <span id="pRate">0%</span>
      </div>
    </div>

    <!-- 권 선택 탭 -->
    <div class="book-tabs">
      <button class="b-tab on" data-b="0">1권 (6과)</button>
      <button class="b-tab" data-b="1">2권 (14과)</button>
      <button class="b-tab" data-b="2">3권 (12과)</button>
    </div>

    <!-- 과 카드 목록 -->
    <div class="lesson-list" id="lessonList"></div>

    <!-- 백업 바 -->
    <div class="backup-box">
      <span style="font-size:12px;color:var(--ink-soft)">진도 데이터 보관</span>
      <div style="display:flex;gap:6px">
        <button class="btn ghost sm" id="exportBtn">백업 받기</button>
        <button class="btn ghost sm" id="importBtn">불러오기</button>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>
    </div>
  </section>

  <!-- ===== PRACTICE VIEW ===== -->
  <section id="practiceView" hidden>
    <button class="back-btn" id="backBtn">← 전체 과 목록</button>

    <div class="hero" style="padding:16px 20px;margin-top:4px">
      <div class="hero-kicker" id="pvKicker">1권 · 제 1 과</div>
      <div class="hero-title" id="pvTitle" style="font-size:24px;margin:2px 0 0">나의 신앙고백과 간증</div>
    </div>

    <!-- 성구 1, 2 전환 토글 -->
    <div class="verse-toggle">
      <button class="vt-btn on" id="vt0">
        <span class="vt-name">성구 1</span>
        <span class="vt-ref" id="vt0Ref">-</span>
      </button>
      <button class="vt-btn" id="vt1">
        <span class="vt-name">성구 2</span>
        <span class="vt-ref" id="vt1Ref">-</span>
      </button>
    </div>

    <!-- 편집 화면 -->
    <div id="editCard" hidden>
      <textarea id="editArea"></textarea>
      <div class="row">
        <button class="btn" id="saveBtn">저장하기</button>
        <button class="btn ghost" id="cancelEditBtn">취소</button>
      </div>
    </div>

    <!-- 읽기 및 퀴즈 화면 -->
    <div id="readCard">
      <div class="card" id="passageCard"></div>
      <div class="row">
        <button class="btn ghost" id="editBtn">말씀 고치기</button>
        <button class="btn cream" id="doneBtn">암송 완료로 표시</button>
      </div>

      <div class="levels">
        <button class="lv-btn on" data-lv="0">쉬움 · 25%</button>
        <button class="lv-btn" data-lv="1">보통 · 55%</button>
        <button class="lv-btn" data-lv="2">전체 가리기</button>
      </div>

      <div id="scoreBox" hidden class="score-box">
        <b id="scoreNum">0%</b>
        <span id="scoreMsg"></span>
      </div>

      <div class="card" id="quizCard"></div>

      <div class="row">
        <button class="btn" id="gradeBtn">채점하기</button>
        <button class="btn ghost" id="againBtn">새 문제</button>
      </div>
      <div class="row">
        <button class="btn cream" id="hintBtn">첫 글자 힌트 보기</button>
      </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div class="nav-bar">
      <button class="btn ghost" id="prevBtn">← 이전</button>
      <button class="btn ghost" id="nextBtn">다음 →</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- iOS/Safari 안전 저장소 래퍼 ---------------- */
const SafeStorage = {
  memory: {},
  getItem(k) {
    try { return window.localStorage ? window.localStorage.getItem(k) : (this.memory[k] || null); }
    catch (e) { return this.memory[k] || null; }
  },
  setItem(k, v) {
    try { if (window.localStorage) window.localStorage.setItem(k, v); } catch (e) {}
    this.memory[k] = String(v);
  }
};

/* ---------------- 32과 64구절 개역개정 커리큘럼 ---------------- */
const CURRICULUM = [
  {
    book: 1,
    title: "1권 제자훈련의 터 다지기",
    lessons: [
      {
        num: 1, title: "나의 신앙고백과 간증",
        verses: [
          { ref: "로마서 10:9, 10", text: "9 네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라\n10 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라" },
          { ref: "마태복음 16:16", text: "16 시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다" }
        ]
      },
      {
        num: 2, title: "하나님과 매일 만나는 생활",
        verses: [
          { ref: "히브리서 4:16", text: "16 그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라" },
          { ref: "예레미야애가 3:22, 23", text: "22 여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다\n23 이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다" }
        ]
      },
      {
        num: 3, title: "경건의 시간",
        verses: [
          { ref: "시편 1:1, 2", text: "1 복 있는 사람은 악인들의 꾀를 따르지 아니하며 죄인들의 길에 서지 아니하며 오만한 자들의 자리에 앉지 아니하고\n2 오직 여호와의 율법을 즐거워하여 그의 율법을 주야로 묵상하는도다" },
          { ref: "시편 119:105", text: "105 주의 말씀은 내 발에 등이요 내 길에 빛이니이다" }
        ]
      },
      {
        num: 4, title: "살았고 운동력있는 말씀",
        verses: [
          { ref: "로마서 1:16", text: "16 내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 먼저는 유대인에게요 그리고 헬라인에게로다" },
          { ref: "디모데후서 3:16", text: "16 모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니" }
        ]
      },
      {
        num: 5, title: "무엇이 바른 기도인가?",
        verses: [
          { ref: "빌립보서 4:6, 7", text: "6 아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라\n7 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라" },
          { ref: "마태복음 6:6", text: "6 너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라" }
        ]
      },
      {
        num: 6, title: "기도의 응답",
        verses: [
          { ref: "요한복음 15:7", text: "7 너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라" },
          { ref: "마태복음 7:11", text: "11 너희가 악한 자라도 좋은 것으로 자식에게 줄 줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐" }
        ]
      }
    ]
  },
  {
    book: 2,
    title: "2권 아무도 흔들 수 없는 나의 구원",
    lessons: [
      {

          { ref: "요한복음 13:34, 35", text: "34 새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라\n35 너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라" },
          { ref: "요한1서 3:18", text: "18 자녀들아 우리가 말과 혀로만 사랑하지 말고 행함과 진실함으로 하자" }
        ]
      }
    ]
  }
];

/* ---------------- 상태 및 저장소 ---------------- */
const STORAGE_KEY = 'discipleship_recite_v1';
let curBook = 0;
let curLesson = 0;
let curVerse = 0;
let level = 0;
let quiz = [];
let graded = false;

let D = { verses: {} }; // key: `${b}_${l}_${v}` -> { done, best, text }

const $ = id => document.getElementById(id);
const toast = m => {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove('show'), 1600);
};

function getKey(b, l, v) { return `${b}_${l}_${v}`; }

function loadData() {
  const raw = SafeStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { D = JSON.parse(raw); } catch(e) { D = { verses: {} }; }
  }
  if (!D || !D.verses) D = { verses: {} };
  renderHome();
}

function saveData() {
  SafeStorage.setItem(STORAGE_KEY, JSON.stringify(D));
}

function getVerseData(b, l, v) {
  const k = getKey(b, l, v);
  const defText = CURRICULUM[b].lessons[l].verses[v].text;
  if (!D.verses[k]) {
    D.verses[k] = { done: false, best: 0, text: defText };
  } else if (!D.verses[k].text) {
    D.verses[k].text = defText;
  }
  return D.verses[k];
}

/* ---------------- 홈 렌더링 ---------------- */
function renderHome() {
  const bData = CURRICULUM[curBook];
  $('hKicker').textContent = bData.title;
  
  // 전체 통계 계산
  let totalV = 0, doneV = 0;
  CURRICULUM.forEach((bk, bIdx) => {
    bk.lessons.forEach((ls, lIdx) => {
      ls.verses.forEach((_, vIdx) => {
        totalV++;
        if (D.verses[getKey(bIdx, lIdx, vIdx)]?.done) doneV++;
      });
    });
  });

  const pct = Math.round((doneV / totalV) * 100) || 0;
  $('pBar').style.width = pct + '\%';$('pText').textContent = `${doneV} / ${totalV} 완료`;
  $('pRate').textContent = `${pct}%`;

  // 과 카드 목록 렌더링
  const listEl = $('lessonList');
  listEl.innerHTML = '';

  bData.lessons.forEach((ls, lIdx) => {
    const card = document.createElement('div');
    card.className = 'l-card';

    const v0Data = getVerseData(curBook, lIdx, 0);
    const v1Data = getVerseData(curBook, lIdx, 1);

    card.innerHTML = `
      <div class="l-head">
        <span class="l-badge">제 ${ls.num} 과</span>
        <span class="l-title">${ls.title}</span>
      </div>
      <div class="v-chips">
        <button class="v-chip ${v0Data.done ? 'done' : ''}" onclick="openPractice(${curBook}, ${lIdx}, 0)">
          <span class="tag">성구 1 ${v0Data.done ? '✓' : ''}</span>
          <span class="ref">${ls.verses[0].ref}</span>
        </button>
        <button class="v-chip ${v1Data.done ? 'done' : ''}" onclick="openPractice(${curBook}, ${lIdx}, 1)">
          <span class="tag">성구 2 ${v1Data.done ? '✓' : ''}</span>
          <span class="ref">${ls.verses[1].ref}</span>
        </button>
      </div>
    `;
    listEl.appendChild(card);
  });

  // 권 탭 활성화 상태
  document.querySelectorAll('.b-tab').forEach((b, idx) => {
    b.classList.toggle('on', idx === curBook);
  });
}

/* ---------------- 연습 화면 ---------------- */
function openPractice(b, l, v) {
  curBook = b; curLesson = l; curVerse = v;
  graded = false;
  $('homeView').hidden = true;
  $('practiceView').hidden = false;
  window.scrollTo(0, 0);

  const lesson = CURRICULUM[b].lessons[l];
  $('pvKicker').textContent = `${CURRICULUM[b].title.split(' ')[0]} · 제 ${lesson.num} 과`;
  $('pvTitle').textContent = lesson.title;

  $('vt0Ref').textContent = lesson.verses[0].ref;
  $('vt1Ref').textContent = lesson.verses[1].ref;

  updateVerseTabUI();
  showRead();
}

function updateVerseTabUI() {
  const v0Done = D.verses[getKey(curBook, curLesson, 0)]?.done;
  const v1Done = D.verses[getKey(curBook, curLesson, 1)]?.done;
  
  $('vt0').classList.toggle('on', curVerse === 0);$('vt1').classList.toggle('on', curVerse === 1);

  $('vt0').querySelector('.vt-name').textContent = `성구 1 ${v0Done ? '✓' : ''}`;
  $('vt1').querySelector('.vt-name').textContent = `성구 2 ${v1Done ? '✓' : ''}`;
}

function showRead() {
  $('editCard').hidden = true;
  $('readCard').hidden = false;

  const vData = getVerseData(curBook, curLesson, curVerse);
  const vs = parseText(vData.text);

  $('passageCard').innerHTML = vs.map(v => 
    `<div class="verse-row"><div class="v-num">${v.n}</div><div class="v-txt">${esc(v.t)}</div></div>`
  ).join('');

  $('doneBtn').textContent = vData.done ? '암송 완료 취소' : '암송 완료로 표시';

  updateVerseTabUI();
  buildQuiz();
}

function showEdit() {
  $('editCard').hidden = false;
  $('readCard').hidden = true;
  const vData = getVerseData(curBook, curLesson, curVerse);
  $('editArea').value = vData.text;
}

const esc = s => s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));

function parseText(text) {
  const out = [];
  let lastNum = 1;
  text.split(/\n+/).forEach(line => {
    const s = line.trim(); if (!s) return;
    const m = s.match(/^(\d{1,3})[.)\s]\s*(.+)$/);
    if (m) {
      lastNum = +m[1];
      out.push({ n: lastNum, t: m[2].trim() });
    } else if (out.length) {
      out[out.length - 1].t += ' ' + s;
    } else {
      out.push({ n: lastNum, t: s });
    }
  });
  return out;
}

/* ---------------- 빈칸 채우기 퀴즈 ---------------- */
const RATIO = [.25, .55, 1];
const norm = s => (s || '').replace(/[^0-9\p{L}]/gu, '');

function buildQuiz() {
  graded = false;
  $('scoreBox').hidden = true;
  $('gradeBtn').textContent = '채점하기';

  const vData = getVerseData(curBook, curLesson, curVerse);
  const vs = parseText(vData.text);
  quiz = []; let id = 0;

  const html = vs.map(v => {
    const toks = v.t.split(/\s+/);
    const idx = toks.map((t, k) => k).filter(k => toks[k].replace(/[^\p{L}]/gu, '').length >= 2);
    const want = Math.max(1, Math.round(idx.length * RATIO[level]));
    const pick = new Set(shuffle(idx.slice()).slice(0, want));
    const line = toks.map((t, k) => {
      if (!pick.has(k)) return esc(t);
      const q = { id: id++, ans: t }; quiz.push(q);
      return `<input class="blank" id="b${q.id}" data-q="${q.id}" style="width:${Math.max(2.8, t.length * 1.05)}em" autocomplete="off" aria-label="빈칸">`;
    }).join(' ');
    return `<div class="verse-row"><div class="v-num">${v.n}</div><div class="v-txt">${line}</div></div>`;
  }).join('');

  $('quizCard').innerHTML = html;
  $('quizCard').querySelectorAll('.blank').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = [...$('quizCard').querySelectorAll('.blank')];
        const i = all.indexOf(el);
        if (all[i + 1]) all[i + 1].focus(); else el.blur();
      }
    });
  });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function grade() {
  if (!quiz.length) return;
  let ok = 0;
  quiz.forEach(q => {
    const el = $('b' + q.id); if (!el) return;
    const right = norm(el.value) === norm(q.ans);
    if (right) ok++;
    const span = document.createElement('span');
    span.className = 'blank ' + (right ? 'ok' : 'no');
    span.style.width = el.style.width;
    span.textContent = el.value || ' ';
    el.replaceWith(span);
    if (!right) {
      const f = document.createElement('span');
      f.className = 'fix';
      f.textContent = q.ans;
      span.after(f);
    }
  });

  graded = true;
  $('gradeBtn').textContent = '다시 풀기';
  const pct = Math.round((ok / quiz.length) * 100);
  $('scoreNum').textContent = pct + '\%';$('scoreMsg').textContent = `${quiz.length}개 중 ${ok}개 정답` + (pct === 100 ? ' · 완벽합니다! ✨' : '');
  $('scoreBox').hidden = false;

  const vData = getVerseData(curBook, curLesson, curVerse);
  if (pct > (vData.best || 0)) { vData.best = pct; saveData(); }
  $('scoreBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------------- 이벤트 리스너 ---------------- */
document.querySelectorAll('.b-tab').forEach(btn => {
  btn.onclick = () => {
    curBook = +btn.dataset.b;
    renderHome();
  };
});

$('backBtn').onclick = () => {$('practiceView').hidden = true;
  $('homeView').hidden = false;
  renderHome();
  window.scrollTo(0, 0);
};

$('vt0').onclick = () => { curVerse = 0; showRead(); };$('vt1').onclick = () => { curVerse = 1; showRead(); };

$('editBtn').onclick = showEdit;
$('cancelEditBtn').onclick = showRead;
$('saveBtn').onclick = () => {
  const t = $('editArea').value.trim();
  if (!t) { toast('말씀을 입력해주세요.'); return; }
  const vData = getVerseData(curBook, curLesson, curVerse);
  vData.text = t;
  saveData();
  showRead();
  toast('저장 완료');
};

$('doneBtn').onclick = () => {
  const vData = getVerseData(curBook, curLesson, curVerse);
  vData.done = !vData.done;
  saveData();
  $('doneBtn').textContent = vData.done ? '암송 완료 취소' : '암송 완료로 표시';
  updateVerseTabUI();
  toast(vData.done ? '암송을 완료했습니다!' : '완료 표시를 취소했습니다.');
};

document.querySelectorAll('.lv-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lv-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    level = +btn.dataset.lv;
    buildQuiz();
  };
});

$('gradeBtn').onclick = () => { graded ? buildQuiz() : grade(); };
$('againBtn').onclick = () => { buildQuiz(); toast('새 빈칸을 생성했습니다'); };
$('hintBtn').onclick = () => {
  if (graded) { toast('새 문제를 먼저 만들어주세요.'); return; }
  quiz.forEach(q => { const el = $('b' + q.id); if (el && !el.value) el.placeholder = q.ans[0] + '…'; });
  toast('첫 글자 힌트를 표시했습니다');
};

// 다음/이전 성구 및 과 이동
$('nextBtn').onclick = () => {
  if (curVerse === 0) {
    curVerse = 1;
    showRead();
  } else {
    const lessons = CURRICULUM[curBook].lessons;
    if (curLesson + 1 < lessons.length) {
      curLesson++; curVerse = 0;
      openPractice(curBook, curLesson, 0);
    } else if (curBook + 1 < CURRICULUM.length) {
      curBook++; curLesson = 0; curVerse = 0;
      openPractice(curBook, 0, 0);
    } else {
      toast('마지막 구절입니다.');
    }
  }
};

$('prevBtn').onclick = () => {
  if (curVerse === 1) {
    curVerse = 0;
    showRead();
  } else {
    if (curLesson > 0) {
      curLesson--; curVerse = 1;
      openPractice(curBook, curLesson, 1);
    } else if (curBook > 0) {
      curBook--;
      curLesson = CURRICULUM[curBook].lessons.length - 1;
      curVerse = 1;
      openPractice(curBook, curLesson, 1);
    } else {
      toast('첫 번째 구절입니다.');
    }
  }
};

/* 데이터 백업 / 복원 */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `제자훈련_암송데이터_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('백업 파일을 다운로드했습니다');
};

$('importBtn').onclick = () => $('fileInput').click();$('fileInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (data && data.verses) {
        D = data; saveData(); renderHome(); toast('데이터를 복원했습니다');
      } else { throw new Error(); }
    } catch(err) {
      toast('올바르지 않은 백업 파일 형식입니다');
    }
  };
  reader.readAsText(file);
};

/* 테마(다크모드) 관리 */
const THEME_KEY = 'discipleship_theme';
function getInitialTheme() {
  const saved = SafeStorage.getItem(THEME_KEY);
  if (saved) return saved;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  catch(e) { return 'light'; }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  SafeStorage.setItem(THEME_KEY, theme);
  const isDark = theme === 'dark';
  $('themeIcon').textContent = isDark ? '☀️' : '🌙';
  $('themeText').textContent = isDark ? '라이트모드' : '다크모드';
  $('metaThemeColor').setAttribute('content', isDark ? '#141524' : '#8B90D4');
}

$('themeToggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

applyTheme(getInitialTheme());
loadData();
</script>
</body>
</html>
